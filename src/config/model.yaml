# ------------------------------------------------------------------
#           Reactor operational mode instructions 
# ------------------------------------------------------------------
model_instructions:

  all_variables:
    variables:
      - states
      - inputs
      - kinetic_functions
      - V
    ignore: 
      - I_m
      - mu_max
      # - S0
      # - SF
      # - C

  variables:
    time: Time
    S: Glucose
    X: Biomass
    P: Protein
    A: Acetate
    C: Citrate
    V: Vreal
    T: Temperature
    I: Induction
    S0: Glucose_0
    SF: Glucose_F

  independent:
    - time
  
  volume:
    name: V
    feeds:
      species:
        - S
      flowrate:
        path: src.model.auxiliar.functions
        function: feed_profile
      concentration:
        S: 
          name: Sf
          path: src.model.auxiliar.functions
          function: feed_concentration_profile

  states: # reference the variables that can be derivated
    X: 
      generation: rX
      source: function 
      path: src.model.core.kinetics
      function: rX_fun
    S:
      generation: rS
      source: function
      path: src.model.core.kinetics
      function: rS_fun
    P:
      generation: rP
      source: function
      path: src.model.core.kinetics
      function: rP_fun
      # source: machine_learning
      # path: src/model/machine_learning/rP/model.pkl
      # features_path: src/model/machine_learning/rP/features.yaml

  inputs: # variable to keep tracking but are not modeled
      T:
        path: src.model.auxiliar.functions
        function: var_profile
      I: 
        path: src.model.auxiliar.functions
        function: I_profile
      C: 
        path: src.model.auxiliar.functions
        function: var_profile
      S0:  
        path: src.model.auxiliar.functions
        function: var_profile
      SF: 
        path: src.model.auxiliar.functions
        function: var_profile
      I_mu: 
        path: src.model.auxiliar.functions
        function: I_mu_profile

  kinetic_functions:
    mu:
      source: function
      path: src.model.core.kinetics
      function: mu_fun
      estimation: true
      residual: rX
    mu_max:
      source: function
      path: src.model.core.kinetics
      function: mu_max_fun
      estimation: false
    qp:
      source: function
      path: src.model.core.kinetics
      function: qp_fun
      estimation: true
      residual: rP
      # source: machine_learning
      # path: src/model/machine_learning/qP/model.pkl
      # features_path: src/model/machine_learning/qP/features.yaml
      
  kinetic_parameters:
    path: src/config/params.yaml

  