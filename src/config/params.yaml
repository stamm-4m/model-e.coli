Project: Nanobody-based Antivenom Production with E. coli Reactor Simulation 
Description: This configuration file contains the settings and parameters for simulating the production of nanobody-based antivenom using E. coli bioreactors. It includes bioreactor settings, kinetic parameters, substrate and acid feed rates, and simulation parameters.
Author: Juan Camilo Castaño Sanchez
Email: jcastano-san@insa-toulose.fr
Date: 01/09/2026

