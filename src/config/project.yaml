# ------------------------------------------------------------------
#                     Simulation config
# ------------------------------------------------------------------
simulation:
  method_ode: 
    type : BDF # Radau # BDF
  rtol_ode: 
    value: 1.0e-7 # 1.0e-6
  max_step:
    value: 0.05 # 0.5
  atol_ode: 
    value: 1.0e-9 # 1.0e-8

# ------------------------------------------------------------------
#                   Workflow and paths
# ------------------------------------------------------------------
workflow:
  model_builder: true
  data_analysis: false
  parameter_estimation: false
  sensitivity_analysis: false
  features_filter: false
  hybrid_model_selection: false
  simulation: false

paths:
  raw_data: "data/raw"
  processed_data: "data/processed/BR_processed.xlsx"
  instructions: "src/config/model.yaml"
  parameters: "src/config/params.yaml"
  estimation_parameters: "src/config/params.yaml"
  features_objective: "results/filtered_features"
  results:
    # data_analysis: "results/data_analysis"
    ead: "results/data_analysis/ead"
    estimation: "results/estimation"
    # parametric_model: "results/parametric_model"
    filtered_features: "results/filtered_features"
    hybrid_model: "results/hybrid_model"

# ------------------------------------------------------------------
#                   Modules config
# ------------------------------------------------------------------

model_builder:
  operation_mode: "FedBatch"

data_treatment:
  ignore:
    - I
    - A
    - S0
    - SF
  states:
    X:
      smooth_crit:
        monotonicity: increasing
        bounds: 
        - 0.1
        - 6  # (3, 5)
        constrains:
          initial_condition: true
          lower_bound_initial: true
          final_maximum: true
    S:
      smooth_crit:
        monotonicity: decreasing
        positivity_end: true
        bounds: 
        - 0.01 
        - 3   # (0.01, 1)  
        constrains:
          initial_condition: true
    P:
      smooth_crit:
        monotonicity: increasing
        positivity_start: true
        bounds: 
        - 0.0001 
        - 0.01 # (0.00001,0.001)
    V:
      smooth_crit:
        monotonicity: increasing
        bounds: 
        - 0.0001 
        - 0.01 #  (0.0001,0.01)
        constrains:
          initial_condition: true
  non_states:
    default:
      smooth_method: savgol
      window: 11
      order: 4



estimation:
  parameters: # "alpha", "gamma_1","Ap_1","gamma_2", "Ap_2","sigma"
    - mu_max_p
    - mu_max_0
    - Ks
    - b
    - m
    - Y_XS

sensitivity_analysis:
  global_target: P

features_filter:
  n_features: 10
  ignore_data: 
    - BR08
  objective_parameter: 
    - qP 
    - rP
  ignore_features:
    - Run_ID
    - Run_T
    - time
    - P
    - dPdt
    - d2Pdt2
    - dTdt
    - d2Tdt2
    - dCdt
    - d2Cdt2
    - dVdt
    - d2Vdt2
    - dSdt
    - d2Sdt2
    - dXdt
    - d2Xdt2
  method: cmi_based # cmi_based cmim mrm_mid mrmr_miq

hybrid_model_selection:
  ignore_data: 
    - BR08
  machine_learning_models:
    - linear
    - poisson
    - tweedie
    - LASSO
    - Ridge
    - elasticnet
    - rf
    - gbm
    - svm_linear
    - svm_rbf
    - svm_poly
    - knn
  tuning_algorithm: grid_search # "grid_search", "random_search", "bayesian_optimization"
  n_trainings: 200