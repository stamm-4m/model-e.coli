estimation:
  parameters: # "alpha", "gamma_1","Ap_1","gamma_2", "Ap_2","sigma"
    - mu_max_p
    - mu_max_0
    - Ks
    - b
    - m
    - Y_XS

sensitivity_analysis:
  global_target: P
  parameters: []

features_filter:
  n_features: 10
  ignore_data: 
    - BR08
  objective_parameter: 
    - qP 
    - qP_2 
    - rP
  ignore_features:
    - Run_ID
    - Run_T
    - time
    - P
    - dPdt
    - d2Pdt2
    - dTdt
    - d2Tdt2
    - dCdt
    - d2Cdt2
    - dVdt
    - d2Vdt2
    - dSdt
    - d2Sdt2
    - dXdt
    - d2Xdt2
  method: "cmi_based" # cmi_based cmim mrm_mid mrmr_miq

hybrid_model_selection:
  ignore_data: 
    - BR08
  machine_learning_models:
    - linear
    - poisson
    - tweedie
    - LASSO
    - Ridge
    - elasticnet
    - rf
    - gbm
    - svm_linear
    - svm_rbf
    - svm_poly
    - knn
  tuning_algorithm: "grid_search" # "grid_search", "random_search", "bayesian_optimization"
  n_trainings: 200